<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 300px;
        padding: 15px;
        font-family: Arial, sans-serif;
      }
      h3 {
        color: #1a73e8;
        margin-top: 0;
      }
      .status {
        padding: 10px;
        border-radius: 5px;
        margin: 10px 0;
      }
      .success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .info {
        background-color: #d1ecf1;
        color: #0c5460;
        border: 1px solid #bee5eb;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #1a73e8;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover {
        background-color: #1557b0;
      }
      .timestamp {
        font-size: 12px;
        color: #666;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <h3>🎓 OBS Cookie Helper</h3>

    <div id="statusBox" class="status info">
      Python programı çalışıyor mu kontrol ediliyor...
    </div>

    <div id="lastSent" class="timestamp"></div>

    <button id="manualSend">Manuel Gönder</button>

    <div style="margin-top: 15px; font-size: 12px; color: #666">
      <strong>Nasıl Çalışır?</strong><br />
      1. OBS'ye giriş yap<br />
      2. Python programını çalıştır<br />
      3. Not listesine git<br />
      4. Cookie otomatik gönderilir
    </div>

    <script src="popup.js"></script>
  </body>
</html>
