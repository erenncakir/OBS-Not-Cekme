<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 300px;
        padding: 15px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f9f8f6;
        color: #5d564f;
      }
      h3 {
        color: #c9b59c;
        margin-top: 0;
        border-bottom: 2px solid #efe9e3;
        padding-bottom: 10px;
        font-weight: 600;
      }
      .status {
        padding: 12px;
        border-radius: 8px;
        margin: 15px 0;
        font-size: 13px;
        font-weight: 500;
      }
      .success {
        background-color: #e3efe5;
        color: #2d5034;
        border: 1px solid #c1dcc6;
      }
      .error {
        background-color: #fae3e3;
        color: #8a2a2a;
        border: 1px solid #eebaba;
      }
      .info {
        background-color: #efe9e3;
        color: #6b6054;
        border: 1px solid #d9cfc7;
      }
      button {
        width: 100%;
        padding: 12px;
        background-color: #c9b59c;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        transition: background-color 0.2s, transform 0.1s;
      }
      button:hover {
        background-color: #bfa386;
      }
      button:active {
        transform: scale(0.98);
      }
      .timestamp {
        font-size: 11px;
        color: #998e83;
        margin: 5px 0 5px 0;
        text-align: right;
      }
      .instructions {
        margin-top: 20px;
        font-size: 12px;
        color: #7a7066;
        background-color: #ffffff;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #efe9e3;
      }
      .instructions strong {
        color: #c9b59c;
      }
    </style>
  </head>
  <body>
    <h3>🎓 OBS Cookie Helper</h3>

    <div id="statusBox" class="status info">
      Python programı çalışıyor mu kontrol ediliyor...
    </div>

    <div id="lastSent" class="timestamp"></div>

    <button id="manualSend">Manuel Gönder</button>

    <div class="instructions">
      <strong>Nasıl Çalışır?</strong><br />
      1. OBS'ye giriş yap<br />
      2. Python programını çalıştır<br />
      3. Not listesine git<br />
      4. Cookie otomatik gönderilir
    </div>

    <script src="popup.js"></script>
  </body>
</html>
